<!DOCTYPE html>
<html lang="en" data-theme="doom">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07090c" />
    <title>THE DOOMSDAY RECEIPT — Avengers: Doomsday</title>
    <meta
      name="description"
      content="Swipe real MCU character portraits, lock your Avengers: Doomsday survival predictions before Dec 18, and challenge your friends Head-to-Head."
    />
    <meta property="og:title" content="THE DOOMSDAY RECEIPT — Avengers: Doomsday Predictions" />
    <meta
      property="og:description"
      content="Lock in your Avengers: Doomsday death pool & theories before Dec 18 and compare receipts with friends."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar-inner">
        <button id="brand-home-btn" class="brand-pill" type="button" title="Back to Swipe Deck">
          <span class="brand-dot"></span>
          <span>DOOMSDAY</span>
        </button>

        <div class="topbar-right">
          <div class="countdown-pill" id="countdown-pill" aria-live="polite">
            <span id="countdown-clock">--D LEFT</span>
          </div>
          <button id="mute-btn" class="icon-btn" type="button" aria-label="Toggle Sound" title="Toggle Sound">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-2" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app-root" class="phone-shell">
      <noscript>
        <div class="noscript-box">JavaScript is required to run The Doomsday Receipt.</div>
      </noscript>
    </main>

    <div id="sheet-root"></div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
